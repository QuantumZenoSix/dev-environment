[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"
# This allows you to run "!" and run a shell command (and see output) - then Ctrl-D to get back to yazi

# If you also using Yazi on Windows:
[[mgr.prepend_keymap]]
on   = "!"
for  = "windows"
run  = 'shell "powershell.exe" --block'
desc = "Open PowerShell here"


[[mgr.prepend_keymap]]
on = [ "g", "h" ]
run = "cd ~/.config/home-manager"
desc = "Cd to nix home-manager"

[[mgr.prepend_keymap]]
on = [ "g", "n" ]
run = "cd /mnt/myhdd"
desc = "Cd to NAS"

