[mgr]
ratio = [1, 2, 5]
sort_by = "alphabetical"
sort_sensitive = false
sort_dir_first = true
linemode = "size"
show_hidden = true
wrap = "yes"
show_symlink = true

[opener]
play = [
	{ run = 'vlc "$@"', orphan = true, for = "unix" },
	# { run = 'mpv "$@"', orphan = true, for = "unix" },
	{ run = '"C:\Program Files\mpv.exe" %*', orphan = true, for = "windows" }
]
edit = [
    # I think yazi checks for the $EDITOR value before why shell scripts have loaded - so $EDITOR it won't be set by my .zshr/bashrc
	{ run = '$EDITOR "$@"', block = true, for = "unix" },
	{ run = '$EDITOR "$@"', block = true, for = "linux" },
    # { run = '/opt/nvim-linux64/bin/nvim "$@"', block = true, for = "unix" },
	{ run = "%EDITOR% %*",  block = true, for = "windows" },
]
view_image = [
  { run = 'sxiv "$@"', desc = "View image with sxiv", block = false }
  # { run = 'qview "$@"', desc = "View image with qview gui", block = false }
]

system_default_linux = [
  { run = 'xdg-open "$@"', desc = "System Default", block = false, for = "unix" }
]

[open]
rules = [
    # Play
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = [ "play", "reveal" ] },


    # Edit
	{ mime = "text/*", use = "edit" },
    { name = "*.json", use = "edit" },
    { name = "*.html", use = [ "open", "edit" ] },


    # View image
    # Use sxiv for images
    { mime = "image/*", use = ["view_image"] },
  
    # Use system default for everything else
    { name = "*", use = ["system_default_linux"] } # Change to system_default_windows if on Windows
]

prepend_previewers = [
	# HEIC previewer
	{ mime = "image/heic", run = "heic" },
]

append_previewers = [
	# My fallback previewer
	{ name = "*", run = "binary" },
]



